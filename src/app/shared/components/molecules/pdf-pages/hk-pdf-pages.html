<div class="flex flex-col gap-4" role="img" [attr.aria-label]="title()">
  @if (state() === 'loading') {
    <hk-skeleton height="60vh" />
  }
  @if (state() === 'error') {
    <p class="text-text-muted text-sm" data-testid="pdf-error">
      La carte n'a pas pu être affichée ici. Ouvrez-la en plein écran ci-dessous.
    </p>
  }
  <!-- Le conteneur reste dans le DOM meme cache : les pages y sont ajoutees avant la fin du
       rendu. Un style en ligne, car l'attribut « hidden » perdrait contre la classe « flex ». -->
  <div
    #pages
    class="flex flex-col gap-4"
    [style.display]="state() === 'ready' ? null : 'none'"
  ></div>
</div>
