<!-- Page de démonstration temporaire, à remplacer par les vrais écrans -->
<main class="bg-muted flex min-h-screen items-center justify-center p-8">
  <section hlmCard class="w-full max-w-md">
    <div hlmCardHeader>
      <h3 hlmCardTitle>{{ title() }}</h3>
      <p hlmCardDescription>Réservations récentes</p>
    </div>

    <div hlmCardContent class="flex flex-col gap-4">
      <!-- Quelques icônes Lucide -->
      <div class="text-primary flex items-center gap-4">
        <ng-icon name="lucidePhoneCall" size="28" />
        <ng-icon name="lucideCalendarCheck" size="28" />
        <ng-icon name="lucideUtensilsCrossed" size="28" />
      </div>

      <!-- Réservations renvoyées par le service -->
      <div class="border-border border-t pt-3">
        <p class="mb-2 text-sm font-medium">{{ reservations().length }} réservation(s) (mock)</p>
        @if (reservations().length > 0) {
          <ul class="flex flex-col gap-1">
            @for (reservation of reservations(); track reservation.id) {
              <li class="text-muted-foreground flex items-center gap-2 text-sm">
                <ng-icon name="lucideCalendarCheck" size="14" />
                {{ reservation.customerName }}, {{ reservation.partySize }} couverts
              </li>
            }
          </ul>
        }
      </div>
    </div>

    <div hlmCardFooter class="flex gap-3">
      <button hlmBtn>
        <ng-icon name="lucidePhoneCall" class="mr-2" size="16" />
        Appels
      </button>
      <button hlmBtn variant="outline">Secondaire</button>
    </div>
  </section>
</main>

<router-outlet />
