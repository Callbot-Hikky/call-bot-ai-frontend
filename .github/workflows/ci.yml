name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start backend (staging branch)
        run: |
          git clone --depth 1 --branch staging https://github.com/Callbot-Hikky/call-bot-ai-backend.git ../backend
          cd ../backend
          POSTGRES_PORT=5432 docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/ping && break
            sleep 5
          done

      # Le serveur de dev proxifie /api vers le back, comme en local (proxy.config.json).
      - name: Serve frontend
        run: |
          pnpm start --port 4200 > /tmp/ng-serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4200/ > /dev/null && break; sleep 3; done

      - name: End-to-end tests
        env:
          E2E_BASE_URL: http://localhost:4200
          E2E_API_URL: http://localhost:8080/api
        run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
