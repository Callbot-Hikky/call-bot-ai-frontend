name: Deploy staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Envoyer le code au serveur
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude '.angular' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/hikky/frontend-src/"

      - name: Construire et déployer sur le serveur
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/opt/hikky/deploy.sh frontend ${{ github.sha }}"
